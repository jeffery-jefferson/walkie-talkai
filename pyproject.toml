[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "walkie-talkai"
version = "0.1.0"
description = "Voice-driven GitHub Copilot assistant with push-to-talk"
requires-python = ">=3.10"
dependencies = [
    "tts-stt-plugin",
    "websockets>=12.0",
    "pywebview>=5.0",
    "pystray>=0.19.4",
    "Pillow>=10.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[project.scripts]
walkie-talkai = "walkie_talkai.__main__:main"

[project.gui-scripts]
walkie-talkai-tray = "walkie_talkai.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
